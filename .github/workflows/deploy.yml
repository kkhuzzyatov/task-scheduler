name: Deploy

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      APP_FRONTEND_URL: ${{ secrets.APP_FRONTEND_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      UNISENDER_API_KEY: ${{ secrets.UNISENDER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build backend services
        run: |
          cd task-tracker-backend
          mvn clean package -DskipTests
          cd ..

          cd task-tracker-email-sender
          mvn clean package -DskipTests
          cd ..

          cd task-tracker-summarization-service
          mvn clean package -DskipTests
          cd ..

          cd task-tracker-scheduler
          mvn clean package -DskipTests
          cd ..

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        run: |
          docker compose -f docker-compose.linux.yml build
          docker compose -f docker-compose.linux.yml push

      - name: Update containers on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/task-scheduler

            export IMAGE_TAG=${{ github.sha }}

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d